<!DOCTYPE html>
<!--
  宣传视频封面 / 社交预览图的**源文件**。

  为什么留 HTML 而不是直接改 PNG：封面里有文案（"40 个公开接口"这类），
  功能一变数字就过期，而图片里的字改不了。留个源文件，改一行重新渲染即可。

  渲染（Windows，Chrome/Chromium 任选）：
    chrome --headless=new --disable-gpu --hide-scrollbars \
      --window-size=960,540 --force-device-scale-factor=2 \
      --screenshot=docs/cover.png docs/cover.html

  · 960×540 的 CSS 尺寸 + 2 倍缩放 = 输出 1920×1080（视频封面标准）
  · 必须 --hide-scrollbars，否则右侧会多 15px 滚动条、比例就不对了
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:960px; height:540px; overflow:hidden; }
  body { background:#0a0e17; color:#e5eaf3;
    font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased; }

  .stage { position:relative; width:960px; height:540px; display:flex;
    gap:34px; padding:52px 54px 46px;
    background:
      radial-gradient(760px 440px at 84% -12%, rgba(6,182,212,.20), transparent 62%),
      radial-gradient(680px 460px at 4% 112%, rgba(59,130,246,.22), transparent 64%),
      linear-gradient(158deg, #0c1424 0%, #0a0e17 56%, #070a12 100%); }
  /* 细网格：只铺左半边，做个"数据"的底纹，不抢主体 */
  .stage::before { content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.030) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.030) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:linear-gradient(118deg, #000 8%, transparent 66%);
    mask-image:linear-gradient(118deg, #000 8%, transparent 66%); }

  .left { position:relative; flex:1 1 auto; width:512px;
    display:flex; flex-direction:column; justify-content:center; }

  .kicker { display:flex; align-items:center; gap:9px;
    font-size:12.5px; letter-spacing:2.4px; color:#7dd3fc; font-weight:600; }
  .kicker i { width:22px; height:2px; background:linear-gradient(90deg,#3b82f6,#06b6d4);
    border-radius:2px; }

  h1 { font-size:52px; line-height:1.16; letter-spacing:-1.2px; margin-top:18px;
    font-weight:800; }
  h1 em { font-style:normal;
    background:linear-gradient(92deg,#60a5fa,#22d3ee 62%,#34d399);
    -webkit-background-clip:text; background-clip:text; color:transparent; }

  .sub { margin-top:16px; font-size:15px; line-height:1.6; color:#93a4bd; }
  .sub b { color:#d7e3f4; font-weight:600; }

  .stats { display:flex; gap:26px; margin-top:30px; }
  .stats div { font-size:11.5px; color:#7c8ba3; letter-spacing:.3px; }
  .stats b { display:block; font-size:21px; color:#eaf2ff; font-weight:700;
    letter-spacing:-.4px; margin-bottom:2px;
    font-variant-numeric:tabular-nums; }

  /* 右侧：分段对比卡 */
  .card { position:relative; width:322px; flex:0 0 322px; align-self:center;
    background:rgba(17,24,39,.82); border:1px solid rgba(59,130,246,.26);
    border-radius:16px; padding:18px 18px 16px;
    box-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05); }
  .card h2 { font-size:12.5px; font-weight:600; color:#9fb0c8; letter-spacing:.4px;
    display:flex; justify-content:space-between; align-items:center; }
  .card h2 span { font-size:10.5px; color:#5f708a; font-weight:500; }

  .rows { margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .row { display:grid; grid-template-columns:26px 1fr 62px 52px; align-items:center;
    font-size:13px; font-variant-numeric:tabular-nums; }
  .row .n { color:#6f8098; font-size:11.5px; }
  .bar { height:7px; border-radius:4px; background:rgba(255,255,255,.07); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; }
  .row .t { text-align:right; color:#dbe6f5; }
  .row .d { text-align:right; font-size:11.5px; font-weight:700; }
  .d.bad { color:#f87171; } .d.good { color:#34d399; }

  .sum { margin-top:15px; padding-top:13px; border-top:1px dashed rgba(255,255,255,.10);
    display:flex; justify-content:space-between; font-size:12px; color:#8fa1ba; }
  .sum b { color:#eaf2ff; font-variant-numeric:tabular-nums; font-size:14px; }
  .sum .ideal b { color:#22d3ee; }

  /* 品牌行放**右上角**：宣传页把这张图当视频封面用时，左下角会叠一行
     「你的圈速，差在哪 + 62 秒」的说明，放左下会撞在一起。 */
  .foot { position:absolute; right:54px; top:26px; display:flex;
    align-items:center; gap:10px; font-size:12px; color:#5d6d85; letter-spacing:.4px; }
  .foot b { color:#8fa1ba; font-weight:700; letter-spacing:.6px; }
  .dot { width:4px; height:4px; border-radius:50%; background:#33415a; }
</style>
</head>
<body>
<div class="stage">

  <div class="left">
    <div class="kicker"><i></i>GRAN TURISMO 7 · 遥测复盘</div>

    <h1>你的圈速，<br><em>差在哪。</em></h1>

    <p class="sub">
      逐帧遥测 · <b>10 类驾驶事件</b> · <b>60Hz</b> 实时仪表盘<br>
      连每只轮子压在什么路面上都有
    </p>

    <div class="stats">
      <div><b>40</b>公开接口</div>
      <div><b>368B</b>逐包解密</div>
      <div><b>0</b>第三方依赖</div>
    </div>
  </div>

  <div class="card">
    <h2>分段对比 <span>第 7 圈 vs 最快圈</span></h2>

    <div class="rows">
      <div class="row">
        <span class="n">S1</span>
        <div class="bar"><i style="width:60%;background:linear-gradient(90deg,#ef4444,#f87171)"></i></div>
        <span class="t">24.82</span><span class="d bad">+0.31</span>
      </div>
      <div class="row">
        <span class="n">S2</span>
        <div class="bar"><i style="width:35%;background:linear-gradient(90deg,#10b981,#34d399)"></i></div>
        <span class="t">31.05</span><span class="d good">−0.18</span>
      </div>
      <div class="row">
        <span class="n">S3</span>
        <div class="bar"><i style="width:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24)"></i></div>
        <span class="t">25.33</span><span class="d bad">+0.52</span>
      </div>
    </div>

    <div class="sum">
      <span>本圈 <b>1:21.20</b></span>
      <span class="ideal">最快圈 <b>1:20.55</b></span>
    </div>
  </div>

  <div class="foot">
    <b>GT7 DASH</b><span class="dot"></span>PS5 遥测 · 本地解密<span class="dot"></span>不上传云端
  </div>

</div>
</body>
</html>
