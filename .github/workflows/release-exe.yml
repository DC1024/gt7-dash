name: Release (Windows EXE)

# 打 tag（v*）时：构建 Windows 三个 exe → 打成 zip → 自动创建 GitHub Release。
# 也可在 Actions 页手动触发（仅产出 artifact，不发 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write            # 创建 Release 需要

jobs:
  # 🔴 发布前必须先过测试，不能"绿灯发布、默默出事"。
  #
  # 为什么是 `uses:` 而不是 `needs: [pytest]`：
  #   `needs` 只能引用**同一个 workflow 文件里**的 job。tests.yml 是另一个
  #   workflow，跨文件的 needs 在 GitHub Actions 里不存在。想复用它就得
  #   把它声明成 `workflow_call`（已加），在这里以 job 的形式调用。
  #   （另一种写法 `workflow_run` 只能拿到"上一次运行结束后"的结果，
  #     而且 tag push 时它压根不触发 —— 等于没拦住，别用。）
  test:
    uses: ./.github/workflows/tests.yml

  windows-exe:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: gt7-decrypt/go.mod
          cache-dependency-path: gt7-decrypt/go.sum

      - name: 安装 PyInstaller
        run: pip install --upgrade pyinstaller

      # 版本号从 gt7_version.py 读一次，后面 Go / PyInstaller / 校验全用它。
      # 🔴 不要在 YAML 里写死版本：真源只有一个，写第二处就是又开了一个漂移点。
      - name: 取版本号
        id: ver
        shell: bash
        run: |
          V=$(python -c "import gt7_version; print(gt7_version.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次构建版本 v$V"
          # tag 构建时再校一次：tag 与真源不一致就直接失败。
          # （tests/test_version_consistency.py 也查同一件事，双保险 ——
          #  那边查不到时会 skip，这里是无条件兜底。）
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$V" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与 gt7_version.py (v$V) 不一致"
              exit 1
            fi
          fi

      - name: 打包仪表盘 exe
        # 🔴 --add-data 必须带上 gt7-event-detector.py：
        #    它在运行时用 importlib 按**文件路径**加载（文件名有连字符，不能 import），
        #    而 onefile 下代码家在临时解包目录里，不打包进去就永远找不到 →
        #    /events 与 /highlights 静默变"不可用"，而 README 把事件集锦当卖点。
        #    --hidden-import 管不了这种情况：它不是 import 出来的。
        # 🔴 --hidden-import gt7_version：版本模块是在 try/except ImportError 里
        #    import 的，PyInstaller 的静态分析有时会把「被 try 包住的 import」
        #    当成可选依赖漏掉，结果 exe 里版本静默变 0.0.0。
        run: >
          pyinstaller --noconfirm --clean --onefile --name gt7-dashboard
          --hidden-import gt7analysis
          --hidden-import gt7_version
          --add-data "gt7-event-detector.py;."
          gt7-dashboard.py

      - name: 打包接收器 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --name gt7-recorder
          --hidden-import gt7_version
          gt7-recorder.py

      - name: 交叉编译解密器（windows/amd64）
        working-directory: gt7-decrypt
        # 🔴 必须显式 bash：windows-latest 的默认 shell 是 PowerShell，
        #    而 `$VERSION` 在 PowerShell 里是**普通变量**（环境变量要写
        #    `$env:VERSION`），结果 `-X main.version=` 注入成空串，
        #    `--version` 只打印 "gt7-decrypt"。实测踩过。
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          # `-s -w` 去掉符号表压缩体积；`-X main.version` 把版本烧进二进制，
          # 这样 `gt7-decrypt.exe --version` 能和 zip 名对得上。
          VERSION: v${{ steps.ver.outputs.version }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../gt7-decrypt.exe .


      - name: 组装 zip 包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item dist/gt7-dashboard.exe bundle/
          Copy-Item dist/gt7-recorder.exe  bundle/
          Copy-Item gt7-decrypt.exe        bundle/
          Copy-Item packaging/windows/*    bundle/
          Compress-Archive -Path bundle/* -DestinationPath gt7-dash-windows-x64.zip -Force
          Get-ChildItem bundle | Select-Object Name, Length

      - name: 校验 exe 内确实带了事件检测器
        # 🔴 门禁而不是提醒：这个文件漏打包过一次，后果是已发布的 exe 里
        #    /events 与 /highlights 静默不可用，而且**没有任何报错**——
        #    用户只会觉得"这版怎么没有事件集锦"。宁可让发布失败。
        shell: pwsh
        run: |
          $out = pyi-archive_viewer -l -r -b dist/gt7-dashboard.exe 2>&1 | Out-String
          if ($out -notmatch "gt7-event-detector\.py") {
            Write-Host $out
            Write-Error "exe 内缺少 gt7-event-detector.py —— /events 与 /highlights 会不可用"
            exit 1
          }
          Write-Host "OK: exe 内已包含 gt7-event-detector.py"

      - name: 校验解密器把版本烧进去了
        # ldflags 写错（变量名改了、-X 路径不对）时 go build **不会报错**，
        # 只是悄悄留成 `dev`。必须实际执行一次才知道。
        shell: pwsh
        run: |
          $want = "v${{ steps.ver.outputs.version }}"
          $out = (& ./gt7-decrypt.exe --version 2>&1 | Out-String).Trim()
          Write-Host "gt7-decrypt --version => $out"
          if ($out -notmatch [regex]::Escape($want)) {
            Write-Error "解密器版本不是 $want（实际：$out）—— ldflags 注入失败"
            exit 1
          }

      - name: 上传构建产物（手动触发时留档）
        uses: actions/upload-artifact@v4
        with:
          name: gt7-dash-windows-x64
          path: gt7-dash-windows-x64.zip
          if-no-files-found: error

      - name: 清掉同名旧 Release（若有）
        if: startsWith(github.ref, 'refs/tags/')
        # 🔴 必须显式指定 bash：本 job 跑在 windows-latest 上，默认 shell 是
        #    PowerShell，下面这套 `if [ -n ... ]` / `$(...)` 会直接语法报错，
        #    整个 job 在这一步挂掉（实测：0 秒失败，后续发布步骤被 skip）。
        #
        # 🔴 这里**故意不写 continue-on-error**：删不掉就必须让 job 红，
        #    否则 action-gh-release 会"就地更新"已存在的 Release 并保留旧
        #    body —— 表面上步骤全绿、实际发行说明是旧的，极难发现（踩过）。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `softprops/action-gh-release` 在 Release 已存在时**保留原 body**，
          # 只更新附件。所以重推 tag 会重建 zip 但说明还是旧的。
          # 先确认删干净，再让它以全新 Release 创建。
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
               --jq .id >/dev/null 2>&1; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
            echo "发现旧 Release id=$ID，删除"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
          else
            echo "无同名 Release，直接创建"
          fi
          # 复核：删完必须查不到，否则后面的 body 不会生效。
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
               --jq .id >/dev/null 2>&1; then
            echo "::error::旧 Release 仍存在，删除没生效"
            exit 1
          fi
          echo "旧 Release 已清干净 ✓"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gt7-dash-windows-x64.zip
          name: GT7 Dash ${{ github.ref_name }}
          # 🔴 不能同时用 `generate_release_notes: true`：实测两者并存时
          #    **自动生成的 notes 会把 body 整个盖掉**，Release 页上只剩
          #    一行 compare 链接（踩过两次）。想要自动 changelog 就自己
          #    在 body 末尾拼一个 compare 链接 —— 见下面「完整变更」那行。
          body: |
            **PS5《Gran Turismo 7》官方 UDP 遥测 → 本地解密 → Web 实时仪表盘 + 公开数据 API。**

            本版是配合 [gt7-coach](https://github.com/DC1024/gt7-coach) `v1.0.0-beta.1`
            的取数需求做的：把工程师要用的接口补齐，并把工程师卡片正面做进实时页。

            ## 📦 下载即用（Windows 免安装）

            附件 `gt7-dash-windows-x64.zip` 含三个 exe，绿色免安装：

            | 文件 | 作用 |
            |---|---|
            | `run-recorder.bat` | 先双击它 —— 接收 PS5 发出的 UDP 遥测并解密 |
            | `run-dashboard.bat` | 再双击它 —— 打开 http://127.0.0.1:8787 看仪表盘 |
            | `gt7-decrypt.exe` | 解密器（被上面两个调用） |

            不装 Docker 也能用。想用 Docker 则见 README 的快速开始。

            ## ✨ 本版新增

            ### 新增接口（第三方同样可用）

            - **`/api/v1/profile`** —— 赛道圈剖面，按**绝对距离**（不是按时间）等分。
              带 `meta.in_progress` 说明这一圈是否还在跑 —— 赛道工程师用它判断
              参考圈「跑完了没有」。此前工程师那边要自己重复建图，现在直接取。
            - **场次列表带 `car_code`** —— 数字车型码，供跨车型时判断「是不是同一台车」。
              用数字码而不是车型名，是因为名字要过一次查表，两边都查不到时
              空对空会被误判成同车。

            ### 仪表盘实时页

            - **「赛道工程师」卡片**：参考圈状态、本圈位置、与参考圈的瞬时时间差、
              距下一个刹车点的距离/秒数、以及它刚说的话
            - **播报内容面板**：最近说过的话逐条列出，带优先级
            - **语音开关 + P0 语音抢占**：P0 硬实时播报可以打断正在念的上一条
            - **云措辞模型输入框**：在播报设置里直接填，不用改配置文件
            - 卡片纳入布局系统（可拖拽排序 / 隐藏 / 半宽 / 整行）

            ## 🔧 修复

            - **「本圈已用时」口径** —— 参考圈此前会把「进行中那一圈」也算进去，
              导致时间基准偏移
            - **HTTP `Server:` 头**改为从 `APP_VERSION` 派生（此前写死 `1.0`，
              发版时容易漏改）

            ## 🧪 测试

            全量 **${{ needs.test.outputs.passed }} passed**（由 `tests.yml` 实时上报，
            不再手写 —— 之前正文里那个 `373` 就是手写常量，用例涨到 400+ 后一直没改）。

            本包版本：**v${{ steps.ver.outputs.version }}**

            ---

            **许可**：MIT

            **完整变更**：https://github.com/DC1024/gt7-dash/compare/v1.0.0...${{ github.ref_name }}
          fail_on_unmatched_files: true
