# GT7 Dash —— Docker Compose 部署
# ================================================================
# 两个服务：
#   gt7-recorder   接收 GT7 UDP 遥测，解密落盘 + 写状态文件
#   gt7-dashboard  Web 仪表盘 + 公开 API（默认端口 8787）
#
# 启动：docker compose up -d
# 打开：http://<本机IP>:8787
#
# ⚠️ 两个服务都必须 network_mode: host —— GT7 用 UDP 广播发遥测，
#    bridge 网络收不到宿主机网段的广播。

services:
  gt7-recorder:
    # 可用 GT7_IMAGE 覆盖：tools/deploy.sh 会用本地构建的
    # gt7-dash:v<version> 顶掉它，避免「改了 tag 但 compose 还拉旧镜像」。
    image: ${GT7_IMAGE:-ghcr.io/dc1024/gt7-dash:latest}
    container_name: gt7-recorder
    network_mode: host
    restart: unless-stopped
    # 🔴 日志轮转（G7）：不设上限的话，json-file 驱动会把 stdout 一直写到
    #    磁盘满 —— recorder 是 7×24 常驻、还带 --verbose，一天几 MB，
    #    几个月就能吃掉几十 GB（服务器实测有过 78% 占用）。
    #    10MB × 3 = 单个容器最多 30MB，够查最近的问题。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 🔴 bind mount 会遮住镜像里的 chown/chmod：宿主机目录必须让 uid 10001
      #    可写，否则首次启动写不了文件。见 README「快速开始」。
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    command:
      - python
      - gt7-recorder.py
      - --output
      - /data
      - --status-file
      - /data/status.json
      # --ps5 auto   ← 默认自动发现 PS5；网络环境复杂时可锁定 IP：
      # --ps5 192.168.x.x
      - --verbose

  gt7-dashboard:
    # 可用 GT7_IMAGE 覆盖：tools/deploy.sh 会用本地构建的
    # gt7-dash:v<version> 顶掉它，避免「改了 tag 但 compose 还拉旧镜像」。
    image: ${GT7_IMAGE:-ghcr.io/dc1024/gt7-dash:latest}
    container_name: gt7-dashboard
    network_mode: host
    restart: unless-stopped
    # 🔴 日志轮转（G7）：不设上限的话，json-file 驱动会把 stdout 一直写到
    #    磁盘满 —— recorder 是 7×24 常驻、还带 --verbose，一天几 MB，
    #    几个月就能吃掉几十 GB（服务器实测有过 78% 占用）。
    #    10MB × 3 = 单个容器最多 30MB，够查最近的问题。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 🔴 这里**故意没有 depends_on**。
    #    depends_on 只影响启动顺序，代价却是：只要动 dashboard，
    #    `docker compose up --force-recreate gt7-dashboard` 会**连带重建
    #    recorder** —— 正在跑的那场比赛会被切成两个文件（真实踩过：
    #    用户的第 11 圈因此丢了 30 秒）。
    #    dashboard 本来就不需要 recorder 先起来：status.json 不存在时
    #    它按"无实时数据"渲染，两个服务都是 restart: unless-stopped，
    #    谁先起来都行。要重建单个服务时仍然建议加 `--no-deps`。
    volumes:
      # 需要写权限：场次管理（收藏/改名/删除）要写 sessions_meta.json
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    command:
      - python
      - gt7-dashboard.py
      - --port
      - "8787"
      - --bind
      - 0.0.0.0
      - --history
      - /data
      - --status
      - /data/status.json
